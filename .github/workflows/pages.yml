name: Publish voice workbench
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: transcript-replay-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check contracts and syntax
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/replay.test.mjs tests/voice-demo.test.mjs
          node --check site/app.mjs
          node --check site/voice-demo.mjs
          node --check site/widget-status.mjs
      - name: Upload only website runtime
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy workbench
        id: deployment
        uses: actions/deploy-pages@v4
