name: Verify workbench contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Policy checks
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Turn contracts and module syntax
        run: |
          node --test tests/replay.test.mjs tests/voice-demo.test.mjs
          node --check site/app.mjs
          node --check site/voice-demo.mjs
          node --check site/widget-status.mjs
      - name: SDK tools and controlled launcher offline
        run: |
          python -m pip install --only-binary=:all: -r requirements-sdk.txt
          python -m unittest discover -s tests -p 'sdk_*.py'
